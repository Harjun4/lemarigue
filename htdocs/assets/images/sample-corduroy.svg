<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FAF6EE"/>
  <rect x="25" y="25" width="450" height="450" fill="#FFFDF9" stroke="#242424" stroke-width="3" rx="8"/>
  <g transform="translate(75, 45)">
    <!-- Waistband -->
    <path d="M100,80 L250,80 L245,110 L105,110 Z" fill="#6B4B35" stroke="#242424" stroke-width="3.5"/>
    <circle cx="175" cy="95" r="5" fill="#F3D361" stroke="#242424" stroke-width="2"/>
    <!-- Belt loops -->
    <rect x="115" y="75" width="6" height="38" fill="#523927" stroke="#242424" stroke-width="1.5"/>
    <rect x="230" y="75" width="6" height="38" fill="#523927" stroke="#242424" stroke-width="1.5"/>
    <!-- Pants legs -->
    <path d="M105,110 L90,340 L155,340 L175,200 L195,340 L260,340 L245,110 Z" fill="#825C43" stroke="#242424" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Corduroy vertical texture lines -->
    <line x1="115" y1="130" x2="105" y2="330" stroke="#6B4B35" stroke-width="2"/>
    <line x1="130" y1="130" x2="120" y2="330" stroke="#6B4B35" stroke-width="2"/>
    <line x1="145" y1="130" x2="135" y2="330" stroke="#6B4B35" stroke-width="2"/>
    <line x1="205" y1="130" x2="215" y2="330" stroke="#6B4B35" stroke-width="2"/>
    <line x1="220" y1="130" x2="230" y2="330" stroke="#6B4B35" stroke-width="2"/>
    <line x1="235" y1="130" x2="245" y2="330" stroke="#6B4B35" stroke-width="2"/>
    <!-- Fly seam -->
    <path d="M175,110 L175,150 Q175,170 160,175" stroke="#242424" stroke-width="2.5" fill="none"/>
  </g>
  <text x="250" y="440" font-family="'Caveat', cursive, sans-serif" font-size="24" font-weight="bold" fill="#242424" text-anchor="middle">Celana Corduroy Cokelat</text>
</svg>
